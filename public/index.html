<!-- Client Script Interactivity -->
    <script>
        const form = document.getElementById('convertForm');
        const statusContainer = document.getElementById('statusContainer');
        const loaderSpinner = document.getElementById('loaderSpinner');
        const resultContent = document.getElementById('resultContent');
        const downloadLink = document.getElementById('downloadLink');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('ytUrl').value;
            const format = document.querySelector('input[name="format"]:checked').value;
            const quality = document.getElementById('qualitySelect').value;

            statusContainer.classList.remove('hidden');
            loaderSpinner.classList.remove('hidden');
            resultContent.classList.add('hidden');

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, format, quality })
                });
                const data = await response.json();
                
                setTimeout(() => {
                    loaderSpinner.classList.add('hidden');
                    resultContent.classList.remove('hidden');
                    if(data.success && data.downloadUrl) {
                        // Directly bind the live stream URL to the download anchor and force a new tab opening
                        downloadLink.href = data.downloadUrl;
                        downloadLink.textContent = `Download ${format.toUpperCase()} Output Now`;
                        downloadLink.setAttribute('target', '_blank');
                        downloadLink.style.display = 'inline-block';
                    } else {
                        document.getElementById('successText').textContent = data.error || 'Server queue congested.';
                        document.getElementById('successText').className = 'text-sm font-semibold text-red-400';
                        downloadLink.style.display = 'none';
                    }
                }, 1200);
            } catch (err) {
                loaderSpinner.classList.add('hidden');
                resultContent.classList.remove('hidden');
                document.getElementById('successText').textContent = 'Network communication error.';
                document.getElementById('successText').className = 'text-sm font-semibold text-red-400';
                downloadLink.style.display = 'none';
            }
        });
    </script>
